name: validate
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r reference/python/requirements.txt
      - run: python tools/build_examples.py
      - run: python reference/python/validate_cdpf.py examples/minimal.cdp
      - run: python reference/python/validate_cdpf.py examples/outpatient-note.cdp
      - run: python -m unittest discover -s tests -v
